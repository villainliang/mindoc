services:
  minidoc:
    image: registry.cn-guangzhou.aliyuncs.com/gdyz/mindoc:local
    restart: always
    container_name: minidoc
    hostname: minidoc
    ports:
      - "8181:8181"
    volumes:
      - ./tmp/database/mindoc.db:/mindoc/database/mindoc.db
      - ./tmp/uploads/:/mindoc/uploads/
    environment:
      BASEURL: https://doc.yztiot.com
      DB_ADAPTER: sqlite3
      MYSQL_INSTANCE_NAME: ./database/mindoc.db
      CACHE: "true"
      CACHE_PROVIDER: file
